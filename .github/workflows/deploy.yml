name: Build and Deploy

# Push na main: testa, publica a imagem no ghcr.io e implanta na VPS (mesmo fluxo do germanos/lumeri).
on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Job 1: typecheck + testes (falha aqui não publica nem implanta)
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # --ignore-scripts: igual ao Dockerfile (better-sqlite3 e argon2 trazem binários pré-compilados)
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test

  # Job 2: constrói a imagem e faz push para o ghcr.io
  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Builder com driver docker-container (necessário para cache type=gha)
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Normaliza o nome da imagem para minúsculas (ghcr.io exige lowercase)
      - name: Lowercase image name
        id: img
        run: echo "name=${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}

      # :latest é o que a VPS puxa; :sha-<commit> fica para rollback
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.img.outputs.name }}:latest
            ${{ env.REGISTRY }}/${{ steps.img.outputs.name }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Job 3: implanta na VPS via SSH (só roda se o build concluir)
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GHCR_PAT
          script: |
            set -e
            # Login só se o secret existir (pacote privado); com o pacote público o pull dispensa login
            if [ -n "$GHCR_PAT" ]; then
              echo "$GHCR_PAT" | docker login ghcr.io -u adriancampana1 --password-stdin
            fi
            cd /opt/services/ig-autoreply
            docker compose pull
            docker compose up -d
            # As migrações rodam na inicialização: o job só passa se o container ficar healthy
            for i in $(seq 1 30); do
              status=$(docker inspect -f '{{.State.Health.Status}}' ig-autoreply)
              [ "$status" = healthy ] && break
              sleep 3
            done
            echo "ig-autoreply: $status"
            docker image prune -f
            [ "$status" = healthy ] || { docker compose logs --tail 50 ig-autoreply; exit 1; }
