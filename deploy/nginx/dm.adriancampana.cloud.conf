# /etc/nginx/sites-available/dm.adriancampana.cloud  (ln -s para sites-enabled)
# Depois de ativar: sudo certbot --nginx -d dm.adriancampana.cloud  (o Certbot adiciona o bloco 443 e o redirect)
server {
    listen 80;
    listen [::]:80;
    server_name dm.adriancampana.cloud;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # $remote_addr (e não $proxy_add_x_forwarded_for): o app confia em exatamente um proxy (src/app.ts) e usa a
        # entrada mais à direita do X-Forwarded-For como IP do cliente. Sobrescrever o cabeçalho com o IP que o Nginx
        # viu impede que um cliente forje o próprio IP enviando um X-Forwarded-For.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
